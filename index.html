<style>
/* Layout: 滿版四聯拍首圖 → 置左文案 → 一行四件、寬留白的商品格；低彩度灰階 */
:root{
  --bg:#ffffff; --paper:#ffffff; --ink:#1b1c1d; --muted:#6a6b6c; --line:#e4e4e2;
  --accent:#8a7a63; --btn:#1b1c1d; --btn-ink:#f7f6f4;
  --ph:#f3f3f2; --ph-ink:#3a3b3c; --sale:#b23a22;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}

.hero{background:var(--bg);padding-top:40px}
.hero picture{display:block;width:70%;max-width:1260px;margin:0 auto}
.hero img{display:block;width:100%;height:auto;aspect-ratio:2400/1484;object-fit:cover;object-position:50% 50%}

.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 72px}
.lead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px 64px;align-items:end;padding-bottom:36px;border-bottom:1px solid var(--ink)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
h1{font-weight:900;font-size:clamp(36px,6vw,60px);line-height:1.05;margin:8px 0 0;letter-spacing:.04em}
.copy{display:grid;gap:10px;max-width:34em}
.copy p{margin:0}
.copy .main{font-size:16px;line-height:1.9}
.copy .note{font-size:13px;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding-block:56px 56px}
.filters{display:flex;flex-wrap:wrap;gap:6px 24px}
.chip{font:inherit;font-family:var(--mono);font-size:13px;letter-spacing:.06em;border:0;background:none;color:var(--muted);padding:4px 0;cursor:pointer;border-bottom:1.5px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chip .n{color:var(--accent);margin-left:4px}
.sort{font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:5px 8px}
.chip:focus-visible,.cart:focus-visible,.sort:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:96px 48px}
.card{display:flex;flex-direction:column;min-width:0}
.img{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--ph);display:grid;place-items:center;overflow:hidden}
.img svg{width:54%;height:auto}
.img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.code{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;background:var(--paper);color:var(--ink);padding:2px 7px}
.made{position:absolute;right:10px;bottom:10px;font-size:11px;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:2px 7px}
.body{display:flex;flex-direction:column;gap:8px;padding-top:20px;flex:1}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h2{font-weight:700;font-size:16px;line-height:1.45;margin:0;text-wrap:balance}
.desc{color:var(--muted);font-size:13.5px;margin:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:8px}
.price{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.cart{flex:none;display:grid;place-items:center;width:42px;height:42px;background:var(--btn);color:var(--btn-ink);text-decoration:none}
.cart svg{width:20px;height:20px}
.cart:hover{opacity:.85}
.promo{background:var(--ink);color:var(--bg);text-align:center;font-size:13px;letter-spacing:.08em;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.promo b{font-weight:700;margin-right:10px;padding-right:10px;border-right:1px solid currentColor}
.na{padding-block:64px 8px}
.na-title{text-align:center;font-weight:500;font-size:clamp(24px,3vw,32px);letter-spacing:.04em;margin:0 0 6px}
.na-sub{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);margin:0 0 36px;text-transform:uppercase}
.na-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.na-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.na-card .img{width:100%}
.na-card .badge{position:absolute;left:0;top:0;z-index:1;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:4px 9px}
.na-card h3{font-weight:500;font-size:15px;margin:14px 0 0;line-height:1.5}
.na-card .foot{justify-content:center;gap:16px;margin-top:auto;padding-top:4px}
.na-card .price{font-weight:500}
.imglink{display:grid;place-items:center;width:100%;height:100%}
.imglink svg{width:54%;height:auto}
.group-head{grid-column:1/-1;display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:-56px}
.group-head:not(:first-child){margin-top:40px}
.group-head h3{margin:0;font-size:clamp(24px,3vw,32px);font-weight:500;letter-spacing:.04em}
.group-head span{font-size:13px;color:var(--muted);letter-spacing:.08em}
.pricebox{display:grid;gap:2px}
.pricebox .was{min-height:18px;line-height:18px;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pricebox .orig{color:var(--muted);font-family:var(--mono);text-decoration-thickness:1px}
.price .now{color:var(--sale);font-weight:500}
.pricebox .off{display:inline-block;font-size:11px;letter-spacing:.04em;color:var(--sale);border:1px solid currentColor;padding:0 5px;vertical-align:2px}
.price{white-space:nowrap}
.sold{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slides{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;scroll-snap-align:start}
.dots{position:absolute;left:0;right:0;top:10px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--paper);opacity:.45}
.dots i.on{opacity:1}
.nav{position:absolute;top:50%;translate:0 -50%;width:34px;height:34px;display:grid;place-items:center;border:0;background:var(--paper);color:var(--ink);cursor:pointer;opacity:0;transition:opacity .2s}
.nav.prev{left:8px}.nav.next{right:8px}
.img:hover .nav,.nav:focus-visible{opacity:.92}
@media (hover:none){.nav{display:none}}
footer{margin-top:120px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:4px}

@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:80px 36px}}
@media (max-width:720px){.group-head{margin-bottom:-28px}.na-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding-bottom:6px}.na-card{flex:0 0 72%;scroll-snap-align:start}.promo{font-size:12px}.hero{padding-top:0}.hero picture{width:100%}.hero img{height:auto;aspect-ratio:4/5}.lead{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 18px}h2{font-size:14.5px}.desc{display:none}.cart{width:38px;height:38px}}
@media (prefers-reduced-motion:no-preference){.card:hover .img img{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.img img{transition:none}}
</style>

  pants:'<path d="M30 12h40l6 76H56L50 40l-6 48H24z"/>',
  shorts:'<path d="M28 20h44l8 52H56l-6-28-6 28H20z"/>',
  beanie:'<path d="M24 66a26 30 0 0 1 52 0z"/><rect x="22" y="64" width="56" height="14" rx="3"/>',
  bag:'<path d="M20 38h60l-4 48H24z"/><path d="M36 38v-8a14 14 0 0 1 28 0v8" fill="none" stroke="var(--ph-ink)" stroke-width="5"/>',
  sock:'<path d="M38 14h22v46l18 12a9 9 0 0 1-6 16H48a10 10 0 0 1-10-10z"/>'
};
const art = k => `<svg viewBox="0 0 100 100" aria-hidden="true" fill="var(--ph-ink)" stroke-linejoin="round">${icons[k]||icons.tee}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => "NT$ " + n.toLocaleString("en-US");

const pickGroups = [
  {title:"Casual Select", sub:"開久", codes:["J39","T-67","CD09","L91","CJ02","L84"]},
  {title:"20SS", sub:"韓系選物", codes:["S01","S02","S03","S05","S07","S06"]},
  {title:"Algar選品", sub:"韓系男裝", codes:["AG01","AG03","AG05","AG07","AG10","AG08"]},
];
const picks = pickGroups.flatMap(g=>g.codes);
const cats = ["日常精選","外套","上身","下身","配件","開久製造","20SS","Algar選品","全部"];
let current = "日常精選", sort = "pick";
const filters = document.getElementById("filters"), grid = document.getElementById("grid"), sortEl = document.getElementById("sort");
const match = (p,c) => c==="全部" || (c==="日常精選" ? picks.includes(p.code) : c==="開久製造" ? p.made : (c==="20SS"||c==="Algar選品") ? p.brand===c : p.cat===c);

function renderFilters(){
  filters.innerHTML = cats.map(c=>`<button class="chip" id="cat-${esc(c)}" aria-pressed="${c===current}">${esc(c)}<span class="n">${products.filter(p=>match(p,c)).length}</span></button>`).join("");
  filters.querySelectorAll(".chip").forEach((b,i)=>b.onclick=()=>{current=cats[i];renderFilters();renderGrid()});
}
const link = (p,inner) => `<a class="imglink" href="${esc(p.link)}" target="_blank" rel="sponsored noopener" tabindex="-1">${inner}</a>`;
function gallery(p){
  const n = p.n || 1, alt = esc(p.code+' '+p.name);
  if(n===1) return link(p,`<img src="img/${esc(p.code)}.jpg" alt="${alt}" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(art('${p.icon}')))">`);
  const src = i => p.imgs ? `https://down-tw.img.susercontent.com/file/${esc(p.imgs[i])}@resize_w450_nl.webp` : `img/${esc(p.code)}${i?'-'+(i+1):''}.jpg`;
  return `${link(p,`<div class="slides">${Array.from({length:n},(_,i)=>`<img src="${src(i)}" alt="${alt} 第 ${i+1} 張" loading="lazy">`).join("")}</div>`)}
    <div class="dots" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join("")}</div>
    <button class="nav prev" aria-label="上一張">‹</button><button class="nav next" aria-label="下一張">›</button>`;
}
function bindGalleries(root){
  root.querySelectorAll(".slides").forEach(sl=>{
    const box = sl.closest(".img"), dots = box.querySelectorAll(".dots i");
    const idx = () => Math.round(sl.scrollLeft / sl.clientWidth);
    sl.addEventListener("scroll",()=>{const k=idx();dots.forEach((d,i)=>d.classList.toggle("on",i===k))},{passive:true});
    box.querySelector(".prev").onclick=()=>sl.scrollTo({left:(idx()-1)*sl.clientWidth,behavior:"smooth"});
    box.querySelector(".next").onclick=()=>sl.scrollTo({left:((idx()+1)%dots.length)*sl.clientWidth,behavior:"smooth"});
  });
}
const cardHTML = p=>`
    <article class="card">
      <div class="img">${gallery(p)}<span class="code">${esc(p.label||p.code)}</span>${p.made?'<span class="made">開久製造</span>':""}</div>
      <div class="body">
        <div class="meta">${esc(p.brand||"Casual Select")} · ${esc(p.cat)}</div>
        <h2>${esc(p.name)}</h2>
        <p class="desc">${esc(p.desc)}</p>
        <div class="foot">
          <div class="pricebox"><div class="was">${p.orig?`<s class="orig">${fmt(p.orig)}</s>${p.off?`<span class="off">${esc(p.off)}</span>`:""}`:""}</div><div class="price"><span class="${p.orig?"now":""}">${fmt(p.price)}</span></div>${p.sold?`<div class="sold">蝦皮已售出 ${esc(p.sold)}</div>`:""}</div>
          <a class="cart" href="${esc(p.link)}" target="_blank" rel="sponsored noopener" aria-label="到蝦皮購買 ${esc(p.name)}" title="到蝦皮購買"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.2l2.3 11h10.3l2-8H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg></a>
        </div>
      </div>
    </article>`;
function renderGrid(){
  let list = products.filter(p=>match(p,current));
  if(current==="日常精選" && sort==="pick") list=[...list].sort((a,b)=>picks.indexOf(a.code)-picks.indexOf(b.code));
  if(sort==="low") list=[...list].sort((a,b)=>a.price-b.price);
  if(sort==="high") list=[...list].sort((a,b)=>b.price-a.price);
  const sorter = l => sort==="low"?[...l].sort((x,y)=>x.price-y.price):sort==="high"?[...l].sort((x,y)=>y.price-x.price):l;
  if(current==="日常精選"){
    grid.innerHTML = pickGroups.map(g=>`<div class="group-head"><h3>${esc(g.title)}</h3><span>${esc(g.sub)} · ${g.codes.length} 件</span></div>`+sorter(g.codes.map(c=>products.find(p=>p.code===c)).filter(Boolean)).map(cardHTML).join("")).join("");
  } else {
    grid.innerHTML = list.map(cardHTML).join("");
  }
  bindGalleries(grid);
}
sortEl.onchange = () => { sort = sortEl.value; renderGrid(); };
document.getElementById("na").innerHTML = newArrivals.map(p=>`
  <article class="na-card">
    <div class="img">${gallery({...p,n:4,icon:"tee"})}<span class="badge">NEW</span></div>
    <h3>${esc(p.name)}</h3>
    <div class="foot"><span class="price">${fmt(p.price)}</span><a class="cart" href="${esc(p.link)}" target="_blank" rel="sponsored noopener" aria-label="到蝦皮購買 ${esc(p.name)}" title="到蝦皮購買"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.2l2.3 11h10.3l2-8H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg></a></div>
  </article>`).join("");
bindGalleries(document.getElementById("na"));
renderFilters(); renderGrid();

// 點擊統計：每次點到蝦皮連結，送一筆事件給 Google Analytics
document.addEventListener("click",e=>{
  const a=e.target.closest('a[rel~="sponsored"]'); if(!a||typeof gtag!=="function") return;
  const card=a.closest(".card,.na-card"), code=card&&card.querySelector(".code");
  const name=card&&card.querySelector("h2,h3");
  gtag("event","shopee_click",{
    item_code: code?code.textContent:"",
    item_name: name?name.textContent:"",
    area: a.closest(".na-card")?"new_arrival":"list",
    tab: typeof current!=="undefined"?current:"",
    link_type: a.classList.contains("cart")?"cart_button":"image",
    transport_type:"beacon"
  });
});
</script>

<script>if(window.dsInternal){var b=document.createElement("div");b.textContent="自己人模式：不計入 GA";b.style.cssText="position:fixed;left:12px;bottom:12px;z-index:9999;background:#1b1c1d;color:#fff;font:12px system-ui,sans-serif;padding:6px 10px;border-radius:999px;opacity:.85;pointer-events:none";document.body.appendChild(b)}</script>
</body>
</html>
